<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brain Gym</title>
  <meta name="description" content="Spaced repetition over my Kindle highlights.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brain Gym">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <style>
    /* Geist, self-hosted so the app works offline and pulls from no third party. */
    @font-face {
      font-family: Geist; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(./geist-latin-ext.woff2) format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: Geist; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(./geist-latin.woff2) format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
  <style>
    /* shadcn/ui zinc tokens, light + dark */
    :root {
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --input: #e4e4e7;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --secondary: #f4f4f5;
      --secondary-foreground: #18181b;
      --ring: #a1a1aa;
      --again: #dc2626;
      --hard: #d97706;
      --good: #16a34a;
      --easy: #2563eb;
      --note: #854d0e;
      --note-bg: #fefce8;
      --radius: 0.75rem;
      --sans: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --background: #09090b;
        --foreground: #fafafa;
        --card: #101012;
        --muted: #27272a;
        --muted-foreground: #a1a1aa;
        --border: #27272a;
        --input: #27272a;
        --primary: #fafafa;
        --primary-foreground: #18181b;
        --secondary: #27272a;
        --secondary-foreground: #fafafa;
        --ring: #52525b;
        --again: #f87171;
        --hard: #fbbf24;
        --good: #4ade80;
        --easy: #60a5fa;
        --note: #fde68a;
        --note-bg: #26200b;
      }
    }
    :root[data-theme="dark"] {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #101012;
      --muted: #27272a;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --input: #27272a;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --ring: #52525b;
      --again: #f87171;
      --hard: #fbbf24;
      --good: #4ade80;
      --easy: #60a5fa;
      --note: #fde68a;
      --note-bg: #26200b;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    #app {
      display: flex; flex-direction: column;
      min-height: 100dvh;
      width: min(27rem, 100%);
      margin: 0 auto;
      padding: calc(0.9rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
    }

    /* ---- Header ---- */
    .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
    .bar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .bar .pos { color: var(--muted-foreground); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

    .pills {
      display: flex; gap: 0.35rem;
      overflow-x: auto; scrollbar-width: none;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      padding: 0.7rem 1rem;
      margin: 0 -1rem;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 0.9rem, #000 calc(100% - 1.6rem), transparent);
      mask-image: linear-gradient(to right, transparent, #000 0.9rem, #000 calc(100% - 1.6rem), transparent);
    }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 1px solid var(--input);
      background: var(--background); color: var(--foreground);
      border-radius: 999px;
      min-height: 2rem;
      padding: 0.2rem 0.7rem;
      font-size: 0.78rem; font-weight: 550; line-height: 1;
      display: inline-flex; align-items: center; gap: 0.35rem;
      touch-action: pan-x;
    }
    .pill .n { color: var(--muted-foreground); font-size: 0.68rem; font-variant-numeric: tabular-nums; }
    .pill[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .pill[aria-pressed="true"] .n { color: color-mix(in srgb, var(--primary-foreground) 65%, transparent); }

    .progress { height: 4px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .progress > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.2s ease; }
    @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }

    /* ---- Card stage ---- */
    .stage {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; justify-content: center;
      gap: 1rem; overflow-y: auto; padding: 1.25rem 0;
    }
    .prompt-label { color: var(--muted-foreground); font-size: 0.72rem; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; }
    .stage .quote { margin: 0; font-size: 1.2rem; font-weight: 450; line-height: 1.5; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .stage .question { margin: 0; font-size: 1.15rem; font-weight: 650; line-height: 1.45; letter-spacing: -0.01em; }
    .answer { border-top: 1px solid var(--border); padding-top: 1rem; display: grid; gap: 0.7rem; }
    .answer .quote { font-size: 1.05rem; }
    .answer .src-line { font-size: 0.85rem; color: var(--muted-foreground); }
    .answer .src-line .bt { color: var(--foreground); font-weight: 650; }
    .badge {
      display: inline-flex; align-items: center;
      border-radius: 999px;
      background: var(--secondary); color: var(--secondary-foreground);
      padding: 0.1rem 0.6rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.01em;
      vertical-align: middle;
    }
    .note-box { background: var(--note-bg); color: var(--note); border-radius: calc(var(--radius) - 2px); padding: 0.6rem 0.75rem; font-size: 0.8rem; margin: 0; }
    .note-box::before { content: "your note — "; font-weight: 700; }

    /* ---- Controls ---- */
    .controls { display: grid; gap: 0.5rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      padding: 0 0.9rem; height: 3rem;
      font-size: 0.95rem; font-weight: 600;
      background: var(--primary); color: var(--primary-foreground);
      white-space: nowrap;
    }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .grade {
      display: grid; gap: 0.1rem; justify-items: center;
      background: var(--background); border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      padding: 0.55rem 0.25rem;
    }
    .grade b { font-size: 0.85rem; font-weight: 650; }
    .grade span { font-size: 0.68rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .grade.g0 b { color: var(--again); } .grade.g1 b { color: var(--hard); }
    .grade.g2 b { color: var(--good); } .grade.g3 b { color: var(--easy); }

    /* ---- Deck-clear state ---- */
    .done {
      flex: 1;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 0.6rem; text-align: center;
    }
    .done .big { font-size: 2.4rem; }
    .done h2 { margin: 0; font-size: 1.2rem; letter-spacing: -0.02em; }
    .done p { margin: 0; color: var(--muted-foreground); font-size: 0.85rem; }
    .foot-note { margin: 0; padding-top: 0.9rem; color: var(--muted-foreground); font-size: 0.7rem; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./data.js"></script>
  <script>
    const { themes, books } = window.ANKI;
    const THEME = Object.fromEntries(themes.map(t => [t.id, t.label]));
    const app = document.getElementById("app");
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // Only highlights aligned with the source book's core subject enter the
    // deck — the classifier pass would enforce this upstream. Deterministic
    // shuffle (hash of id) so new cards mix books but stay stable.
    const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
    const cards = books.flatMap(b => b.highlights.map(h => ({ ...h, book: b })))
      .filter(c => c.aligned)
      .sort((a, b) => hash(a.id) - hash(b.id));

    // ---- Spaced repetition: SM-2 with Anki's learning steps ----
    //
    // Day-granularity alone collapses Hard and Good into the same "1d" on a
    // brand-new card, which makes the two buttons indistinguishable exactly
    // when you use them most. Real Anki avoids that by walking new cards
    // through sub-day learning steps first, so every grade lands somewhere
    // different. Due times are therefore timestamps, not day numbers.
    //
    // Card states: lrn (learning), rev (review), rel (relearning after a lapse).
    const SRS_KEY = "brain-gym.srs.v2";
    const MIN = 60e3, DAY = 864e5;
    const LEARN_STEPS = [1 * MIN, 10 * MIN];   // new card path
    const RELEARN_STEPS = [10 * MIN];          // after a lapse
    const GRAD_IVL = 1;      // days, graduating with Good
    const EASY_IVL = 4;      // days, graduating straight out with Easy
    const LAPSE_IVL = 1;     // days, where a lapsed card restarts
    const HARD_FACTOR = 1.2, EASY_BONUS = 1.3, MIN_EF = 1.3, START_EF = 2.5;

    const loadSrs = () => { try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch { return {}; } };
    const saveSrs = s => localStorage.setItem(SRS_KEY, JSON.stringify(s));
    let srs = loadSrs();

    const freshState = () => ({ st: "lrn", step: 0, ef: START_EF, ivl: 0, due: 0, reps: 0, lapses: 0 });

    // Pure: given a state and a grade, return the state that would follow.
    // Both the grade buttons (for their labels) and applyGrade use this, so a
    // button can never promise an interval the scheduler won't deliver.
    function schedule(prev, g, now) {
      const s = { ...(prev || freshState()) };
      const days = (n) => { s.due = now + n * DAY; s.ivl = n; };
      const mins = (ms) => { s.due = now + ms; };

      if (s.st === "lrn") {
        if (g === 0) { s.step = 0; mins(LEARN_STEPS[0]); }
        else if (g === 1) {
          // Hard repeats the current step; on the first step Anki uses the
          // average of step one and two, which is what makes it ~6m not 1m.
          mins(s.step === 0 ? (LEARN_STEPS[0] + LEARN_STEPS[1]) / 2 : LEARN_STEPS[s.step]);
        } else if (g === 2) {
          if (s.step + 1 >= LEARN_STEPS.length) { s.st = "rev"; s.reps += 1; days(GRAD_IVL); }
          else { s.step += 1; mins(LEARN_STEPS[s.step]); }
        } else { s.st = "rev"; s.reps += 1; days(EASY_IVL); }
        return s;
      }

      if (s.st === "rel") {
        if (g <= 1) mins(RELEARN_STEPS[0]);
        else if (g === 2) { s.st = "rev"; s.reps += 1; days(Math.max(1, s.ivl || LAPSE_IVL)); }
        else { s.st = "rev"; s.reps += 1; days(Math.max(1, s.ivl || LAPSE_IVL) + 1); }
        return s;
      }

      // Review card.
      const ivl = s.ivl || GRAD_IVL;
      if (g === 0) {
        s.st = "rel"; s.step = 0; s.lapses += 1;
        s.ef = Math.max(MIN_EF, s.ef - 0.2);
        s.ivl = LAPSE_IVL;                       // where it lands once relearned
        s.due = now + RELEARN_STEPS[0];
        return s;
      }
      // Compute all three from the pre-grade ease, then force them strictly
      // apart. Rounding alone lets Good and Easy collide on short intervals
      // (at ivl 1 both round to 3d), which hides the difference between the
      // buttons on exactly the young cards where it matters most.
      s.reps += 1;
      const hardI = Math.max(ivl + 1, Math.round(ivl * HARD_FACTOR));
      const goodI = Math.max(hardI + 1, Math.round(ivl * s.ef));
      const easyI = Math.max(goodI + 1, Math.round(ivl * s.ef * EASY_BONUS));
      if (g === 1) { s.ef = Math.max(MIN_EF, s.ef - 0.15); days(hardI); }
      else if (g === 2) { days(goodI); }
      else { s.ef += 0.15; days(easyI); }
      return s;
    }

    function applyGrade(id, g) {
      srs[id] = schedule(srs[id], g, Date.now());
      saveSrs(srs);
      return srs[id];
    }

    // Label for a grade button: how far away that choice puts the card.
    function delayLabel(prev, g) {
      const now = Date.now();
      return fmtDelay(schedule(prev, g, now).due - now);
    }
    // Months and years carry a decimal (Anki does the same): rounding 33d and
    // 42d both to "1mo" would make two different intervals read identically.
    const trim = (n) => n.toFixed(1).replace(/\.0$/, "");
    function fmtDelay(ms) {
      const m = ms / MIN;
      if (m < 1) return "<1m";
      if (m < 60) return Math.round(m) + "m";
      const h = m / 60;
      if (h < 24) return Math.round(h) + "h";
      const d = h / 24;
      if (d < 30) return Math.round(d) + "d";
      if (d < 365) return trim(d / 30) + "mo";
      return trim(d / 365) + "y";
    }

    const NEW_PER_SESSION = 20;
    // A card counts as due when its timestamp has passed; cards never seen
    // are drip-fed at NEW_PER_SESSION per deck.
    function dueCards(theme) {
      const now = Date.now();
      const pool = cards.filter(c => theme === "all" || c.theme === theme);
      const due = pool.filter(c => srs[c.id] && srs[c.id].due <= now);
      const fresh = pool.filter(c => !srs[c.id]).slice(0, NEW_PER_SESSION);
      return [...due, ...fresh];
    }

    // ---- App state: the review IS the app ----
    let activeTheme = "all";
    let session = newSession("all");

    function newSession(theme) {
      const queue = dueCards(theme);
      return { queue, done: 0, total: queue.length, revealed: false };
    }
    function setTheme(theme) {
      activeTheme = theme;
      session = newSession(theme);
      render();
    }

    function pillsHtml() {
      const pills = [
        `<button class="pill" aria-pressed="${activeTheme === "all"}" data-theme="all">All <span class="n">${dueCards("all").length}</span></button>`,
        ...themes.map(t =>
          `<button class="pill" aria-pressed="${activeTheme === t.id}" data-theme="${t.id}">${esc(t.label)} <span class="n">${dueCards(t.id).length}</span></button>`)
      ].join("");
      return `<div class="pills">${pills}</div>`;
    }

    function headerHtml(pos) {
      return `
        <div class="bar">
          <h1>Brain Gym</h1>
          <span class="pos">${pos}</span>
        </div>
        ${pillsHtml()}`;
    }

    function render() {
      const s = session;

      if (!s.queue.length) {
        app.innerHTML = `
          ${headerHtml("")}
          <div class="progress"><div style="width:100%"></div></div>
          <div class="done">
            <div class="big">✓</div>
            <h2>${s.done ? "Deck clear" : "Nothing due"}</h2>
            <p>${s.done
              ? `${s.done} card${s.done === 1 ? "" : "s"} reviewed${activeTheme === "all" ? "" : " in " + esc(THEME[activeTheme])}.<br>The schedule takes it from here.`
              : `No ${activeTheme === "all" ? "" : esc(THEME[activeTheme]) + " "}cards due today.<br>Pick another theme or come back tomorrow.`}</p>
          </div>
          <p class="foot-note">${books.length} books · ${cards.length} cards in the deck</p>`;
        bindPills();
        return;
      }

      const c = s.queue[0];
      const st = srs[c.id];
      const isQ = !!c.q;
      const pct = Math.round(100 * s.done / s.total);

      const front = isQ
        ? `<span class="prompt-label">Recall · ${esc(c.book.title)}</span>
           <p class="question">${esc(c.q)}</p>`
        : `<span class="prompt-label">Which book is this from — and why did you save it?</span>
           <p class="quote">${esc(c.text)}</p>`;

      const back = !s.revealed ? "" : `
        <div class="answer">
          ${isQ ? `<p class="quote">${esc(c.text)}</p>` : ""}
          <p class="src-line"><span class="bt">${esc(c.book.title)}</span> — ${esc(c.book.author)} · loc. ${c.loc} · <span class="badge">${esc(THEME[c.theme])}</span></p>
          ${c.note ? `<p class="note-box">${esc(c.note)}</p>` : ""}
        </div>`;

      const grades = [["Again", 0], ["Hard", 1], ["Good", 2], ["Easy", 3]].map(([label, g]) =>
        `<button class="grade g${g}" data-g="${g}"><b>${label}</b><span>${delayLabel(st, g)}</span></button>`).join("");

      app.innerHTML = `
        ${headerHtml(`${s.done + 1} / ${s.total}${st ? "" : " · new"}`)}
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="stage">${front}${back}</div>
        <div class="controls">
          ${s.revealed ? `<div class="grades">${grades}</div>`
                       : `<button class="btn" id="reveal">Show answer</button>`}
        </div>`;

      bindPills();
      const rv = document.getElementById("reveal");
      if (rv) rv.addEventListener("click", () => { s.revealed = true; render(); });
      document.querySelectorAll(".grade").forEach(b => b.addEventListener("click", () => {
        const next = applyGrade(c.id, Number(b.dataset.g));
        s.queue.shift();
        // A card that graduated to review is finished for today. One still in
        // a learning step comes back later this session, a few cards down, so
        // you get spacing rather than an immediate re-show.
        if (next.st === "rev") s.done += 1;
        else s.queue.splice(Math.min(3, s.queue.length), 0, c);
        s.revealed = false;
        render();
      }));
    }

    function bindPills() {
      document.querySelectorAll(".pill").forEach(p =>
        p.addEventListener("click", () => setTheme(p.dataset.theme)));
    }

    render();

    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
