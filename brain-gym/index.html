<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brain Gym is now My Anki</title>
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0; url=https://hectorcflores.github.io/my-anki/app/">
  <link rel="canonical" href="https://hectorcflores.github.io/my-anki/app/">
  <style>
    html { background: #09090b; color: #a1a1aa; color-scheme: dark; }
    body { font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0;
           min-height: 100dvh; display: grid; place-items: center; padding: 2rem; text-align: center; }
    h1 { color: #fafafa; font-size: 1.05rem; font-weight: 600; margin: 0 0 .5rem; }
    a { color: #fafafa; }
  </style>
</head>
<body>
  <main>
    <h1>Brain Gym is now My Anki</h1>
    <p>Taking you to <a href="https://hectorcflores.github.io/my-anki/app/">the new address</a>&hellip;</p>
  </main>
  <script>
    // Belt and braces alongside the meta refresh above. The service worker
    // sitting next to this file unregisters itself and clears this app's
    // caches, but an already-open tab reaches here first, so redirect from
    // here too rather than depending on the worker's client re-navigation.
    //
    // Deliberately does NOT touch localStorage. The old app's keys live on
    // this same origin and My Anki copies them on first load — clearing them
    // here would throw away exactly the review history this redirect exists
    // to hand over.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((r) => { if (r.scope.includes("/brain-gym/")) r.unregister(); }))
        .catch(() => {});
    }
    location.replace("https://hectorcflores.github.io/my-anki/app/");
  </script>
</body>
</html>
