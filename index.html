<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <title>Apps</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* shadcn/ui default dark theme (zinc) */
    :root {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted-foreground: 240 5% 64.9%;
      --border: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
      --radius: 0.5rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      margin: 0;
      padding: 16px;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(440px, 100%);
      padding: 24px;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      background: hsl(var(--card));
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 14px;
      color: hsl(var(--muted-foreground));
    }

    nav {
      display: grid;
      gap: 8px;
    }

    .app-button {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 0 16px;
      border-radius: calc(var(--radius) - 2px);
      background: hsl(var(--secondary));
      color: hsl(var(--secondary-foreground));
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 150ms;
    }

    .app-button:hover {
      background: hsl(var(--secondary) / 0.8);
    }

    .app-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px hsl(var(--background)), 0 0 0 3px hsl(var(--ring));
    }

    /* Shared account control — same markup and hex values as the three apps.
       The session is one session: all four pages are on this origin and share
       the Firebase project, so signing in here signs you into every app. */
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .account {
      display: inline-flex; align-items: center; gap: 7px;
      min-height: 0; padding: 3px 10px 3px 4px;
      border: 1px solid #27272a; border-radius: 999px;
      background: transparent; color: #fafafa;
      font: inherit; font-size: 12px; font-weight: 500; line-height: 1.3;
      cursor: pointer;
    }
    .account .av {
      width: 20px; height: 20px; border-radius: 999px;
      background: #27272a; color: #fafafa;
      font-size: 11px; font-weight: 600;
      display: grid; place-items: center;
    }
    .account.out {
      padding: 3px 11px; border-color: transparent;
      background: #fafafa; color: #18181b; font-weight: 600;
    }
    .account.off { cursor: default; opacity: 0.6; color: #a1a1aa; }
    .account:focus-visible { outline: 2px solid #52525b; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <h1>Apps</h1>
      <span id="account"></span>
    </div>
    <p class="subtitle" id="subtitle">One sign-in covers all three.</p>
    <nav>
      <a class="app-button" href="https://hectorcflores.github.io/my-pomodoro/app/index.html">Pomodoro</a>
      <a class="app-button" href="https://hectorcflores.github.io/my-reading-list/app/index.html">Reading List</a>
      <a class="app-button" href="https://hectorcflores.github.io/brain-gym/">Brain Gym</a>
    </nav>
  </main>
  <script type="module">
    const FIREBASE = {
      apiKey: "AIzaSyA5_DhdTdqjCVDeOgklUFcnJ1lwfESiP8Y",
      authDomain: "my-reading-list-3fa75.firebaseapp.com",
      projectId: "my-reading-list-3fa75",
      appId: "1:101190488885:web:f0401ddd67b862f163b27c",
    };
    const slot = document.getElementById("account");
    const subtitle = document.getElementById("subtitle");
    (async () => {
      try {
        const [{ initializeApp }, auth] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
        ]);
        const instance = auth.getAuth(initializeApp(FIREBASE));
        await auth.setPersistence(instance, auth.browserLocalPersistence);
        const provider = new auth.GoogleAuthProvider();
        auth.getRedirectResult(instance).catch((e) => console.warn(e));

        auth.onAuthStateChanged(instance, (user) => {
          slot.textContent = "";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = user ? "account" : "account out";
          if (user) {
            const name = (user.email || "Signed in").split("@")[0];
            const av = document.createElement("span");
            av.className = "av";
            av.textContent = name.slice(0, 1).toUpperCase();
            btn.append(av, document.createTextNode(name));
            btn.title = `${user.email || "Signed in"} — sign out`;
            subtitle.textContent = "Signed in — all three apps are in sync.";
          } else {
            btn.textContent = "Sign in";
            subtitle.textContent = "One sign-in covers all three.";
          }
          btn.addEventListener("click", async () => {
            if (!user) {
              try {
                await auth.signInWithPopup(instance, provider);
              } catch (e) {
                const popupIssues = [
                  "auth/popup-blocked",
                  "auth/popup-closed-by-user",
                  "auth/cancelled-popup-request",
                  "auth/operation-not-supported-in-this-environment",
                ];
                if (popupIssues.includes(e.code)) await auth.signInWithRedirect(instance, provider);
                else console.warn(e);
              }
            } else if (confirm("Sign out of sync on this device?")) {
              auth.signOut(instance);
            }
          });
          slot.append(btn);
        });
      } catch (e) {
        console.warn("Apps: auth unavailable", e);
        subtitle.textContent = "Sign in with Google inside any app to sync.";
      }
    })();
  </script>
</body>
</html>
